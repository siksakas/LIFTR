<!doctype html>
<!--
  Tuk the tortoise, the animated rig from the LIFTR design prototype.
  Loaded by TukView in a transparent WKWebView. Parameters (window.TUK_PARAMS or the query string):
    stage   1...5                      Tuk's stage (default 2)
    mode    loop | still | breathe | head
    scene   home                       draws Tuk's little world from the Home screen behind him
    static  1                          freezes the first frame (used to render the PNG fallbacks)
  window.tuk.set({stage, mode}) changes the stage in place, so colours and poses ease across.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@font-face{font-family:'Patrick Hand';src:url("PatrickHand-Regular.ttf") format('truetype')}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tuk-host{position:absolute;left:0;top:0;width:100%;height:100%}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;display:none}
.has-scene #scene{display:block}
.lf-sky,.lf-hill,.lf-ground,.lf-tree{transition:fill 1.4s ease}
.lf-fade{transition:opacity 1.1s ease}
.lf-cloud-a{animation:lf-drift 46s ease-in-out infinite alternate}
.lf-cloud-b{animation:lf-drift 60s ease-in-out -20s infinite alternate-reverse}
@keyframes lf-drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.is-static *{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){.tuk *,#scene *{animation:none!important}}
/* LIFTR prototype — shared motion + Tuk rig. Layout and colour live inline in each artboard. */

/* ===== Tuk rig ===== */
.tuk{position:relative;display:block;will-change:transform}
.tuk svg{display:block;width:100%;height:100%}
.tuk .t-bob{transform-origin:158px 290px}
.tuk .t-shadow{transform-origin:158px 289px}
.tuk .t-head,.tuk .t-head-a{transform-origin:150px 140px}
.tuk .t-armN-u,.tuk .t-armN-u-a{transform-origin:106px 152px}
.tuk .t-armN-f,.tuk .t-armN-f-a{transform-origin:102px 176px}
.tuk .t-armF-u,.tuk .t-armF-u-a{transform-origin:184px 150px}
.tuk .t-armF-f,.tuk .t-armF-f-a{transform-origin:186px 174px}
.tuk .t-eyeF{transform-origin:100px 95px}
.tuk .t-eyeN{transform-origin:123px 92px}
.tuk .t-glow{transform-origin:125px 206px}
.tuk .t-puff{transform-origin:80px 114px}
.tuk .t-sprout,.tuk .t-sprout-a{transform-origin:196px 93px}
.tuk .t-g1{transform-origin:176px 97px}
.tuk .t-g2{transform-origin:214px 96px}
.tuk .t-g3{transform-origin:236px 112px}
.tuk .t-g4{transform-origin:190px 100px}
.tuk .t-moss{transform-origin:194px 104px}
.tuk .t-wisp{stroke-dasharray:72;stroke-dashoffset:72}

/* gentle stage-to-stage transitions: smoke fades, eyes open, colour warms, sprouts grow */
.tuk .t-tr{transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.tuk .t-fill{transition:fill 1.4s ease}
.tuk .t-fade{transition:opacity 1s ease}
.tuk .t-grow{transition:transform 1.2s cubic-bezier(.34,1.45,.64,1),opacity .7s ease}
.tuk .t-g2{transition-delay:.15s}.tuk .t-g3{transition-delay:.3s}.tuk .t-g4{transition-delay:.45s}

/* Stage 1 · smoking loop (5s) */
.tuk[data-stage="1"] .t-bob{animation:t1-bob 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-head-a{animation:t1-head 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-armN-u-a{animation:t1-nu 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-armN-f-a{animation:t1-nf 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-armF-f-a{animation:t1-ff 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-cig-a{animation:t1-cig 5s linear infinite}
.tuk[data-stage="1"] .t-glow{animation:t1-glow 5s ease-in-out infinite}
.tuk[data-stage="1"] .t-wisp{animation:t1-wisp 5s ease-out infinite}
.tuk[data-stage="1"] .t-puff{animation:t1-puff 5s ease-out infinite}
.tuk[data-stage="1"] .t-mo{animation:t1-mo 5s linear infinite}
.tuk[data-stage="1"] .t-ml{animation:t1-ml 5s linear infinite}
.tuk[data-stage="1"] .t-eyeF,.tuk[data-stage="1"] .t-eyeN{animation:t1-eye 5s ease-in-out infinite}
.tuk .t-haze1{animation:t-haze 7s ease-in-out infinite}
.tuk .t-haze2{animation:t-haze 9s ease-in-out -3s infinite reverse}
.tuk .t-haze3{animation:t-haze 8s ease-in-out -5s infinite}
@keyframes t1-bob{0%,15%{transform:translate(0,0) rotate(0deg) scale(1,1)}20%{transform:translate(-2px,1px) rotate(-1.4deg) scale(1,1)}26%{transform:translate(2px,0) rotate(1.1deg) scale(1,1)}32%{transform:translate(0,0) rotate(0deg) scale(1,1)}50%{transform:translate(0,0) rotate(0deg) scale(1,1.012)}80%{transform:translate(0,0) rotate(0deg) scale(1,.994)}100%{transform:translate(0,0) rotate(0deg) scale(1,1)}}
@keyframes t1-head{0%,34%{transform:translateY(0) rotate(0deg)}46%,64%{transform:translateY(1px) rotate(-4deg)}72%,86%{transform:translateY(-1px) rotate(3deg)}97%,100%{transform:translateY(0) rotate(0deg)}}
@keyframes t1-nu{0%,34%{transform:rotate(0deg)}47%,66%{transform:rotate(95deg)}71%,86%{transform:rotate(84deg)}98%,100%{transform:rotate(0deg)}}
@keyframes t1-nf{0%,34%{transform:rotate(0deg)}47%,66%{transform:rotate(86deg)}71%,86%{transform:rotate(74deg)}98%,100%{transform:rotate(0deg)}}
@keyframes t1-ff{0%,16%{transform:rotate(0deg)}21%{transform:rotate(-6deg)}26%{transform:rotate(3deg)}31%,100%{transform:rotate(0deg)}}
@keyframes t1-cig{0%,41%{opacity:0}45%,90%{opacity:1}95%,100%{opacity:0}}
@keyframes t1-glow{0%,49%{opacity:.4;transform:scale(.8)}55%,63%{opacity:1;transform:scale(1.3)}70%,100%{opacity:.5;transform:scale(.9)}}
@keyframes t1-wisp{0%,52%{opacity:0;transform:translateY(6px);stroke-dashoffset:72}58%{opacity:.9}74%{opacity:.6;transform:translateY(-8px);stroke-dashoffset:0}86%,100%{opacity:0;transform:translateY(-18px);stroke-dashoffset:0}}
@keyframes t1-puff{0%,68%{opacity:0;transform:translate(0,0) scale(.2)}72%{opacity:.95;transform:translate(-3px,-1px) scale(.5)}80%{opacity:.95;transform:translate(-14px,-6px) scale(.92)}90%{opacity:.7;transform:translate(-32px,-16px) scale(1.12)}100%{opacity:0;transform:translate(-50px,-28px) scale(1.28)}}
@keyframes t1-mo{0%,69%{opacity:0}71%,84%{opacity:1}88%,100%{opacity:0}}
@keyframes t1-ml{0%,69%{opacity:1}71%,84%{opacity:0}88%,100%{opacity:1}}
@keyframes t1-eye{0%,8%{transform:scaleY(1)}10%{transform:scaleY(.12)}12%,51%{transform:scaleY(1)}55%,64%{transform:scaleY(.12)}68%,100%{transform:scaleY(1)}}
@keyframes t-haze{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-5px)}}

/* Stage 2 · cutting down (warm tea) */
.tuk[data-stage="2"] .t-bob{animation:t-breath 6s ease-in-out infinite}
.tuk[data-stage="2"] .t-steam1{animation:t-steam 2.8s ease-out infinite}
.tuk[data-stage="2"] .t-steam2{animation:t-steam 2.8s ease-out 1.4s infinite}
.tuk[data-stage="2"] .t-eyeF,.tuk[data-stage="2"] .t-eyeN{animation:t-blink 6s ease-in-out 1s infinite}
@keyframes t-breath{0%,100%{transform:translate(0,0) rotate(0deg) scale(1,1)}50%{transform:translate(0,0) rotate(0deg) scale(1,1.012)}}
@keyframes t-steam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-12px)}}
@keyframes t-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}

/* Stage 3 · recovering (a big stretch) */
.tuk[data-stage="3"] .t-bob{animation:t3-bob 6s ease-in-out infinite}
.tuk[data-stage="3"] .t-armN-u-a{animation:t3-nu 6s ease-in-out infinite}
.tuk[data-stage="3"] .t-armN-f-a{animation:t3-nf 6s ease-in-out infinite}
.tuk[data-stage="3"] .t-armF-u-a{animation:t3-fu 6s ease-in-out infinite}
.tuk[data-stage="3"] .t-head-a{animation:t3-head 6s ease-in-out infinite}
.tuk[data-stage="3"] .t-eyeF,.tuk[data-stage="3"] .t-eyeN{animation:t3-eye 6s ease-in-out infinite}
@keyframes t3-bob{0%,22%{transform:translate(0,0) rotate(0deg) scale(1,1)}38%,54%{transform:translate(0,-3px) rotate(0deg) scale(.99,1.035)}70%,100%{transform:translate(0,0) rotate(0deg) scale(1,1)}}
@keyframes t3-nu{0%,22%{transform:rotate(0deg)}38%,54%{transform:rotate(108deg)}70%,100%{transform:rotate(0deg)}}
@keyframes t3-nf{0%,22%{transform:rotate(0deg)}38%,54%{transform:rotate(12deg)}70%,100%{transform:rotate(0deg)}}
@keyframes t3-fu{0%,22%{transform:rotate(0deg)}38%,54%{transform:rotate(-132deg)}70%,100%{transform:rotate(0deg)}}
@keyframes t3-head{0%,22%{transform:translateY(0) rotate(0deg)}38%,54%{transform:translateY(-2px) rotate(5deg)}70%,100%{transform:translateY(0) rotate(0deg)}}
@keyframes t3-eye{0%,30%{transform:scaleY(1)}36%,56%{transform:scaleY(.12)}62%,84%{transform:scaleY(1)}87%{transform:scaleY(.12)}90%,100%{transform:scaleY(1)}}

/* Stage 4 · healthy (first sprout) */
.tuk[data-stage="4"] .t-bob{animation:t-breath 4.5s ease-in-out infinite}
.tuk[data-stage="4"] .t-sprout-a,.tuk[data-stage="5"] .t-sprout-a{animation:t-sway 3.4s ease-in-out infinite}
.tuk[data-stage="4"] .t-eyeF,.tuk[data-stage="4"] .t-eyeN{animation:t-blink 4.5s ease-in-out 2s infinite}
@keyframes t-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* Stage 5 · thriving (little hop + wave) */
.tuk[data-stage="5"] .t-bob{animation:t5-hop 3.2s ease-in-out infinite}
.tuk[data-stage="5"] .t-shadow{animation:t5-shadow 3.2s ease-in-out infinite}
.tuk[data-stage="5"] .t-armN-f-a{animation:t5-wave .8s ease-in-out infinite alternate}
.tuk[data-stage="5"] .t-eyeF,.tuk[data-stage="5"] .t-eyeN{animation:t-blink 3.2s ease-in-out 1.6s infinite}
.tuk[data-stage="5"] .t-g1,.tuk[data-stage="5"] .t-g3{animation:t-nod 3.2s ease-in-out infinite}
@keyframes t5-hop{0%,52%,100%{transform:translate(0,0) rotate(0deg) scale(1,1)}7%{transform:translate(0,1px) rotate(0deg) scale(1.035,.955)}17%{transform:translate(0,-15px) rotate(0deg) scale(.98,1.03)}27%{transform:translate(0,0) rotate(0deg) scale(1.03,.96)}36%{transform:translate(0,0) rotate(0deg) scale(1,1)}}
@keyframes t5-shadow{0%,52%,100%{transform:scale(1);opacity:.1}17%{transform:scale(.78);opacity:.06}}
@keyframes t5-wave{0%{transform:rotate(-26deg)}100%{transform:rotate(22deg)}}
@keyframes t-nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* modes */
.tuk[data-mode="still"] *,.tuk[data-mode="head"] *{animation:none!important}
.tuk[data-mode="breathe"] .t-a{animation:none!important}
.tuk[data-mode="breathe"] .t-bob{animation:tb-breathe 10s ease-in-out infinite!important}
.tuk[data-mode="breathe"] .t-eyeF,.tuk[data-mode="breathe"] .t-eyeN{animation:tb-eye 10s ease-in-out infinite!important}
@keyframes tb-breathe{0%{transform:translate(0,0) rotate(0deg) scale(1,1)}40%,50%{transform:translate(0,-2px) rotate(0deg) scale(1.045,1.06)}100%{transform:translate(0,0) rotate(0deg) scale(1,1)}}
@keyframes tb-eye{0%,44%{transform:scaleY(1)}52%,96%{transform:scaleY(.12)}100%{transform:scaleY(1)}}

/* storyboard freeze frames on the stage-1 timeline */
.tuk[data-frame^="f"] *{animation-play-state:paused!important}
.tuk[data-frame="f1"] .t-a{animation-delay:-.2s!important}
.tuk[data-frame="f2"] .t-a{animation-delay:-1.12s!important}
.tuk[data-frame="f3"] .t-a{animation-delay:-2.1s!important}
.tuk[data-frame="f4"] .t-a{animation-delay:-2.9s!important}
.tuk[data-frame="f5"] .t-a{animation-delay:-3.95s!important}
.tuk[data-frame="f6"] .t-a{animation-delay:-4.6s!important}

</style>
</head>
<body>
<svg id="scene" aria-hidden="true" viewBox="0 0 358 306" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="lfWobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="w"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="w" scale="2.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
    <filter id="lfGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"></feTurbulence><feColorMatrix in="n" type="luminanceToAlpha" result="l"></feColorMatrix><feComponentTransfer in="l" result="a"><feFuncA type="linear" slope="1.1" intercept="-0.52"></feFuncA></feComponentTransfer><feFlood flood-color="#3B2A18" result="c"></feFlood><feComposite in="c" in2="a" operator="in"></feComposite></filter>
  </defs>
  <rect id="s-sky" class="lf-sky" x="-60" y="-60" width="478" height="420"></rect>

<script>
(function () {
  var TEMPLATE = `<div class="tuk" data-stage="{{ stage }}" data-mode="{{ mode }}" data-frame="{{ frame }}" style="width: {{ px }}; height: {{ px }}; font-family: 'Figtree', system-ui, sans-serif; color: #2B2621">
<svg viewBox="{{ vb }}" overflow="{{ ov }}" width="100%" height="100%" role="img" aria-label="{{ label }}">
  <defs>
    <filter id="tukTex" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="3" result="warp"><animate attributeName="seed" values="{{ seeds }}" dur="0.42s" calcMode="discrete" repeatCount="indefinite"></animate></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.8" xChannelSelector="R" yChannelSelector="G" result="drawn"></feDisplacementMap>
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="5" result="fine"></feTurbulence>
      <feColorMatrix in="fine" type="luminanceToAlpha" result="fineA"></feColorMatrix>
      <feComponentTransfer in="fineA" result="grain"><feFuncA type="linear" slope="1.0" intercept="-0.5"></feFuncA></feComponentTransfer>
      <feFlood flood-color="#3B2A18" result="inkc"></feFlood>
      <feComposite in="inkc" in2="grain" operator="in" result="inkGrain"></feComposite>

      <feMerge><feMergeNode in="drawn"></feMergeNode><feMergeNode in="grainIn"></feMergeNode></feMerge>
    </filter>
    <filter id="tukSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"></feGaussianBlur></filter>
    <clipPath id="tukClipF"><ellipse cx="100" cy="95" rx="6.6" ry="8.4"></ellipse></clipPath>
    <clipPath id="tukClipN"><ellipse cx="123" cy="92" rx="7.4" ry="9.2"></ellipse></clipPath>
    <radialGradient id="tukGlowG"><stop offset="0" stop-color="#FFE2B8"></stop><stop offset=".4" stop-color="#F4A85E" stop-opacity=".8"></stop><stop offset="1" stop-color="#F4A85E" stop-opacity="0"></stop></radialGradient>

  <g class="t-fade" style="opacity: {{ v.haze }}">

    <path class="t-fill" style="fill: {{ v.shell }}" stroke="#2E2823" stroke-width="3.2" stroke-linejoin="round" d="M132 112 C146 92 182 84 210 96 C240 110 258 146 255 186 C252 224 234 252 204 263 C180 271 150 266 136 252 C126 240 122 200 122 170 C122 146 124 124 132 112 Z"></path>

    <path fill="none" stroke="#2E2823" stroke-width="2.2" stroke-linecap="round" d="M200 124 C194 117 187 110 178 104 M228 121 C229.5 113 229.5 107 228 103 M245 144 C247 145 249 146 251 147 M239 172 C241.5 176.5 243.5 181 245 185 M216 186 C215 205 212 228 207 251 M199 161 C195 162 191 163 187 164"></path>
    <path fill="none" stroke="#2E2823" stroke-width="2.2" stroke-linecap="round" d="M241 124 C250 142 252 166 249 190 C246 220 230 244 205 255 C186 262 164 260 148 250"></path>
    <path fill="none" stroke="#2E2823" stroke-width="1.8" stroke-linecap="round" d="M249 200 L254 202 M243 222 L248 226 M230 241 L234 246 M216 251 L219 258 M190 258 L191 265 M168 257 L167 264"></path>
    <path fill="#2B1A0A" opacity=".13" d="M252 158 C256 204 238 246 205 259 C183 267 160 263 143 252 C172 258 210 246 230 214 C243 194 248 176 252 158 Z"></path>
    <path fill="#FFF8E8" opacity=".32" d="M150 104 C170 92 198 91 216 101 C198 97 174 99 156 111 Z"></path>
