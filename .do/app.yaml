# DigitalOcean App Platform spec for the Liftr backend.
# Create the app with: Apps → Create App → "Import from App Spec" (upload this file),
# or with the CLI: doctl apps create --spec .do/app.yaml
# Then fill in each SECRET's value under the app's Settings → Environment Variables.
name: liftr-backend
region: nyc
services:
  - name: api
    github:
      repo: siksakas/LIFTR
      branch: main
      deploy_on_push: true
    source_dir: backend
    environment_slug: node-js
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: SNOWFLAKE_ACCOUNT
        scope: RUN_TIME
        value: ZYPVZDH-GY01587
      - key: SNOWFLAKE_USER
        scope: RUN_TIME
        value: LIFTR_BACKEND
      - key: SNOWFLAKE_ROLE
        scope: RUN_TIME
        value: LIFTR_APP_ROLE
      - key: SNOWFLAKE_WAREHOUSE
        scope: RUN_TIME
        value: LIFTR_WH
      - key: SNOWFLAKE_DATABASE
        scope: RUN_TIME
        value: LIFTR
      - key: SNOWFLAKE_SCHEMA
        scope: RUN_TIME
        value: APP
      - key: DO_MODEL_ID
        scope: RUN_TIME
        value: llama3.3-70b-instruct
      - key: SNOWFLAKE_PAT
        scope: RUN_TIME
        type: SECRET
      - key: DO_MODEL_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ELEVENLABS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ELEVENLABS_AGENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: APP_TOKEN
        scope: RUN_TIME
        type: SECRET
